opentp: 2026-09
x-acme-team: analytics-platform

info:
  title: Extensions Example
  version: 1.0.0
  description: Example with vendor extensions (x-*) and tool-defined checks
  x-acme-team: analytics-platform

spec:
  paths:
    events:
      root: /events
      template: "{area}/{event}.yaml"

  targets:
    all:
      schema:
        event_name:
          type: string
          policy: fixed
    ios-ga:
      title: iOS (GA4)
      x-acme-team: mobile-platform
      schema:
        os_name:
          type: string
        os_version:
          type: string
        app_version:
          type: string
          x-acme-team: mobile-release

  # Portable named check: defined in the plan, understood by every tool
  checks:
    usr-prefixed:
      title: Prefixed user id
      description: User ids start with usr_ followed by lowercase letters or digits
      pattern: "^usr_[a-z0-9]+$"

  events:
    key:
      pattern: "^[a-z0-9_]+::[a-z0-9_]+$"

    taxonomy:
      area:
        title: Area
        type: string
        required: true
      event:
        title: Event
        type: string
        required: true
      action:
        title: Action
        type: string
        required: true
        # Tool-defined check: tools that do not know it ignore it (and should say so)
        checks:
          mytool.not-empty: true
        x-acme-team: product

    payload:
      targets:
        all: [ios-ga]
      schema:
        user_id:
          type: string
          checks:
            usr-prefixed: true
            mytool.starts-with: usr_
        tags:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [new, returning, premium]
          x-acme-team: growth
