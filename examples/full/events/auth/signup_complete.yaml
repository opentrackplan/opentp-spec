opentp: 2026-09

event:
  key: auth::signup_complete

  lifecycle:
    status: active

  taxonomy:
    action: User completes registration

  payload:
    web:
      schema:
        application_id:
          value: shop
        event_name:
          value: signup_complete
        event_category:
          value: auth
        signup_method:
          enum: [email, google, github]
          required: true
        has_referral: {}
        dimension_2:
          name: referralCode
          title: Referral code

    mobile:
      schema:
        application_id:
          value: shop
        event_name:
          value: signup_complete
        event_category:
          value: auth
        signup_method:
          required: true
        has_referral: {}
        push_opt_in: {}
        dimension_2:
          name: referralCode
          title: Referral code
