opentp: 2026-09

event:
  key: dashboard::dashboard_view

  lifecycle:
    status: active

  taxonomy:
    action: User opens the dashboard

  payload:
    schema:
      application_id:
        value: admin-console
      event_name:
        value: dashboard_view
      event_category:
        value: dashboard
      dimension_1:
        name: orgType
        title: Organization type
        description: Organization type of the signed-in user, stored in analytics slot dimension_1
        enum: [startup, enterprise, agency]
        example: enterprise
      widgets_count:
        example: 7
      has_notifications:
        example: true
