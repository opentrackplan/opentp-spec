opentp: 2026-09

event:
  key: onboarding::onboarding_step_complete

  lifecycle:
    status: active

  taxonomy:
    action: User completes an onboarding step

  payload:
    mobile:
      schema:
        application_id:
          value: shop
        event_name:
          value: onboarding_step_complete
        event_category:
          enum: [onboarding, activation]
        step_number:
          required: true
        step_name:
          required: true
          example: Choose a plan
        is_skipped: {}
        dimension_3:
          name: experimentVariant
          title: Onboarding experiment variant
          enum: [control, short_flow]
