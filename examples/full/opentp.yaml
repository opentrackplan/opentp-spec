opentp: 2026-09

info:
  title: Example Tracking Plan
  version: 1.0.0
  description: Sample tracking plan for demonstration purposes
  contact:
    - Analytics Team <analytics@example.com>

spec:
  paths:
    events:
      root: /events
      template: "{area}/{event}.yaml"
    dictionaries:
      root: /dictionaries

  # Common fields: part of every event on a target
  targets:
    all:
      title: Every target
      description: Fields that every event sends on every target
      schema:
        application_id:
          type: string
          title: Application
          dict: data/application_id
          policy: fixed
        event_name:
          type: string
          title: Event name
          policy: fixed
        event_category:
          type: string
          title: Event category
          policy: restricted
    ios:
      title: iOS app
      schema:
        device_model:
          type: string
          title: Device model
          description: Hardware model identifier reported by the device
          example: "iPhone15,2"

  # Portable named checks, applied with checks: { <id>: true }
  checks:
    jira-key:
      title: Jira issue key
      pattern: "^[A-Z]+-[0-9]+$"

  events:
    key:
      pattern: "^[a-z0-9_]+::[a-z0-9_]+$"

    taxonomy:
      area:
        title: Area
        type: string
        dict: taxonomy/areas
        required: true
      event:
        title: Event
        type: string
        required: true
      action:
        title: Action
        type: string
        description: Human-readable description of what triggers the event
        maxLength: 100
        required: true
      priority_level:
        title: Priority Level
        type: number
        enum: [1, 2, 3]
        required: false
      is_internal:
        title: Internal Event
        type: boolean
        enum: [true, false]
        required: false

    payload:
      targets:
        all: [web, ios, android]
        mobile: [ios, android]
      # Field catalog: every field events may use (listing a field here does not add it to events)
      schema:
        # Analytics slots: the catalog gives the type, each event gives the meaning
        dimension_1: &dim
          type: string
        dimension_2: *dim
        dimension_3: *dim
        screen_name:
          type: string
          title: Screen name
          description: Name of the screen or page where the event happened
          maxLength: 100
          example: login
        user_id:
          type: string
          title: User ID
        auth_method:
          type: string
          enum: [email, google, github, apple]
        signup_method:
          type: string
          enum: [email, google, github, apple]
        has_referral:
          type: boolean
        push_opt_in:
          type: boolean
        widgets_count:
          type: integer
          minimum: 0
        has_notifications:
          type: boolean
        total_steps:
          type: integer
          minimum: 1
        skipped_steps:
          type: integer
          minimum: 0
        duration_seconds:
          type: number
          minimum: 0
        step_number:
          type: integer
          minimum: 1
        step_name:
          type: string
          maxLength: 100
        is_skipped:
          type: boolean

    pii:
      kind:
        required: true
        dict: governance/pii-kinds
      masker:
        required: false
      schema:
        owner:
          type: string
          dict: governance/pii-owners
          required: true
        jira:
          type: string
          required: true
          checks:
            jira-key: true
        retention_days:
          type: integer
          enum: [0, 7, 30]
          required: false
